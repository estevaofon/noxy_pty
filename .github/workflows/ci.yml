# CI da extensao: os testes do pacote ptys num shell de verdade em cada
# plataforma que tem implementacao propria (creack/pty no Linux, ConPTY no
# Windows), mais a compilacao de todos os alvos do release.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh release/build.sh pty
